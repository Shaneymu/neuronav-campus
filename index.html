<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>NeuroNav Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }

      /* Custom marker styles for Leaflet */
      .custom-marker {
        transition: transform 0.3s ease;
      }
      .custom-marker:hover {
        transform: scale(1.1);
        z-index: 1000 !important;
      }

      /* Custom Tooltip Styling */
      .leaflet-tooltip.custom-tooltip {
        background-color: rgba(255, 255, 255, 0.95);
        border: 1px solid #cbd5e1;
        color: #334155;
        font-weight: 600;
        border-radius: 6px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 0.8rem;
        padding: 4px 8px;
      }
      .dark .leaflet-tooltip.custom-tooltip {
        background-color: rgba(30, 41, 59, 0.95);
        border-color: #475569;
        color: #e2e8f0;
      }
      .leaflet-tooltip-top:before {
        border-top-color: rgba(255, 255, 255, 0.95);
      }
      .dark .leaflet-tooltip-top:before {
        border-top-color: rgba(30, 41, 59, 0.95);
      }

      /* User location pulsing marker */
      .user-location-marker {
        position: relative;
        width: 18px;
        height: 18px;
      }
      .user-location-marker .dot {
        position: absolute;
        inset: 0;
        background-color: #2563eb;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .dark .user-location-marker .dot {
        background-color: #60a5fa;
        border-color: #0f172a;
      }
      .user-location-marker .pulse {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background-color: rgba(37, 99, 235, 0.35);
        animation: user-location-pulse 2s ease-out infinite;
      }
      .dark .user-location-marker .pulse {
        background-color: rgba(96, 165, 250, 0.35);
      }
      @keyframes user-location-pulse {
        0%   { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(2.4); opacity: 0; }
      }

      /* Accessibility: Reduce Motion */
      body.reduce-motion *,
      body.reduce-motion *::before,
      body.reduce-motion *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      /* Accessibility: High Contrast */
      body.high-contrast {
        filter: contrast(1.25) saturate(1.1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
